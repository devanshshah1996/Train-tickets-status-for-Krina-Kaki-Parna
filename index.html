<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Control System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: sans-serif; 
        }
        .top-section { 
            height: 80vh; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background-color: #f8fafc; 
            padding: 1rem; 
        }
        .bottom-section { 
            height: 20vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #e2e8f0; 
            border-top: 2px solid #cbd5e1; 
        }
        /* Custom scrollbar for memo list */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-lg border border-gray-100">
            <div class="mb-5 text-center">
                <h1 class="text-2xl font-bold text-gray-800">Memo Retrieval System</h1>
                <p class="text-sm text-gray-500 mt-1">Select a recent memo to issue inventory, or enter manually.</p>
            </div>

            <!-- MEMO SELECTION WRAPPER (Hides on fetch success) -->
            <div id="memo-selection-wrapper">
                <!-- Recent Memos Action Buttons -->
                <div class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-bold text-gray-800">Recent Issued Memos</label>
                        <span id="refresh-indicator" class="text-xs text-gray-400 flex items-center gap-1 opacity-0 transition-opacity">
                            <svg class="animate-spin w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32" stroke-linecap="round"></circle></svg>
                            Checking...
                        </span>
                    </div>
                    <div id="memo-buttons-container" class="flex flex-col gap-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                        <!-- Buttons populated via JS -->
                    </div>
                </div>

                <div class="relative flex py-2 items-center mb-4">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-xs uppercase font-medium">Or Manual Entry</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <!-- Manual Fetch Section -->
                <div class="flex flex-col sm:flex-row gap-3 mb-2">
                    <div class="w-full relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </div>
                        <input type="text" id="memo-input" placeholder="Enter 7-digit memo (e.g., 3124567)" class="w-full pl-9 border-gray-300 bg-gray-50 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2.5 border outline-none text-sm text-gray-700 disabled:bg-gray-100 disabled:text-gray-400">
                    </div>
                    
                    <button id="fetch-btn" class="sm:w-32 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-sm flex justify-center items-center gap-2">
                        Fetch
                    </button>
                </div>
            </div>

            <!-- ACTIVE MEMO DETAILS (Hidden initially) -->
            <div id="active-memo-details" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-5 mb-2 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 right-0 w-16 h-16 bg-blue-100 rounded-bl-full -mr-8 -mt-8 z-0"></div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold text-blue-500 uppercase tracking-wider">Active Memo Data</span>
                        <span id="active-memo-time" class="text-xs text-blue-600 font-medium bg-blue-100 border border-blue-200 px-2 py-1 rounded"></span>
                    </div>
                    <h2 id="active-memo-id" class="text-2xl font-black text-blue-900 font-mono tracking-tight"></h2>
                    <p id="active-memo-customer" class="text-sm font-semibold text-blue-700 mt-1"></p>
                </div>
            </div>

            <!-- Dynamic Global Alert Box -->
            <div id="global-alert" class="hidden px-4 py-3 rounded-lg relative mb-4 items-center justify-center gap-2 border mt-4 transition-all" role="alert">
                <svg id="global-alert-icon" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
                <span id="global-alert-text" class="block sm:inline font-semibold text-sm"></span>
            </div>

            <!-- Hardware Section -->
            <div id="success-section" class="hidden border-t border-gray-100 pt-5 mt-4">
                <div class="flex flex-col gap-4">
                    
                    <!-- DEVICE SELECTION WRAPPER (Hides on connect success) -->
                    <div id="device-selection-wrapper">
                        <label class="block text-sm font-bold text-gray-800 mb-3">Select Hardware Interface</label>
                        <div class="flex gap-2">
                            <button class="device-btn flex-1 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-2.5 px-1 rounded-lg text-xs sm:text-sm transition-all shadow-sm" data-id="reader1">
                                Reader 1 (Main)
                            </button>
                            <button class="device-btn flex-1 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-2.5 px-1 rounded-lg text-xs sm:text-sm transition-all shadow-sm" data-id="reader2">
                                Reader 2 (Desk)
                            </button>
                            <button class="device-btn flex-1 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-2.5 px-1 rounded-lg text-xs sm:text-sm transition-all shadow-sm" data-id="reader3">
                                Reader 3 (Sec)
                            </button>
                        </div>
                        
                        <div class="flex items-center gap-2 mt-3">
                            <span class="text-sm font-medium text-gray-500">Status:</span>
                            <span id="connection-status-temp" class="text-sm font-semibold text-gray-400">Awaiting Hardware Selection</span>
                        </div>
                    </div>

                    <!-- ACTIVE DEVICE DISPLAY (Hidden initially) -->
                    <div id="active-device-display" class="hidden flex items-center justify-between bg-green-50 border border-green-200 p-3.5 rounded-lg">
                        <div class="flex items-center gap-2.5">
                            <span class="flex h-3 w-3 relative">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                            </span>
                            <span id="active-device-name" class="font-bold text-green-800 text-sm"></span>
                        </div>
                        <span class="text-xs font-bold text-green-700 uppercase tracking-wide bg-green-100 px-2 py-1 rounded">Connected</span>
                    </div>

                    <!-- LED Button -->
                    <button id="led-btn" data-state="off" class="hidden w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 px-4 rounded-lg transition duration-200 shadow-md flex justify-center items-center gap-2 mt-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Turn LED On
                    </button>
                </div>
            </div>

            <!-- Reset Button -->
            <div class="mt-6 pt-4 flex justify-center border-t border-gray-100 min-h-[50px]">
                <button id="reset-btn" class="hidden flex items-center gap-1.5 text-sm text-red-500 hover:text-red-700 font-semibold transition-colors bg-red-50 hover:bg-red-100 px-5 py-2 rounded-full border border-red-100">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reset System
                </button>
            </div>
        </div>
    </div>

    <!-- 20% Bottom Inactive Area -->
    <div class="bottom-section">
        <h2 class="text-xl sm:text-2xl font-bold text-gray-400 uppercase tracking-widest text-center px-4">
            Venus Jewel Diamond Finding Form
        </h2>
    </div>

    <script>
        // Data Initialization
        let memos = [
            { id: '3128492', customer: 'Venus Impex', timestamp: new Date(Date.now() - 1000 * 60 * 2) }, // 2 mins ago (New)
            { id: '3128491', customer: 'Finestar Jewellery', timestamp: new Date(Date.now() - 1000 * 60 * 15) },
            { id: '3128490', customer: 'Kiran Gems', timestamp: new Date(Date.now() - 1000 * 60 * 45) },
            { id: '3000003', customer: 'Error Test Co.', timestamp: new Date(Date.now() - 1000 * 60 * 60 * 2) } // Error trigger
        ];

        // DOM Elements
        const memoSelectionWrapper = document.getElementById('memo-selection-wrapper');
        const activeMemoDetails = document.getElementById('active-memo-details');
        const memoButtonsContainer = document.getElementById('memo-buttons-container');
        const memoInput = document.getElementById('memo-input');
        const fetchBtn = document.getElementById('fetch-btn');
        
        const successSection = document.getElementById('success-section');
        const deviceSelectionWrapper = document.getElementById('device-selection-wrapper');
        const activeDeviceDisplay = document.getElementById('active-device-display');
        const deviceBtns = document.querySelectorAll('.device-btn');
        const connectionStatusTemp = document.getElementById('connection-status-temp');
        
        const ledBtn = document.getElementById('led-btn');
        const resetBtn = document.getElementById('reset-btn');
        const refreshIndicator = document.getElementById('refresh-indicator');
        const globalAlert = document.getElementById('global-alert');
        
        let connectionTimeout = null; 
        let fetchTimeout = null;
        let isProcessing = false;

        // Activity Tracking for Auto-Refresh
        let lastActivityTime = Date.now();
        const updateActivity = () => { lastActivityTime = Date.now(); };
        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => 
            window.addEventListener(evt, updateActivity)
        );

        // Render Memo Action Buttons
        const renderMemos = () => {
            memoButtonsContainer.innerHTML = '';
            const now = Date.now();

            memos.forEach(memo => {
                const isNew = (now - memo.timestamp.getTime()) <= (5 * 60 * 1000); 
                const timeString = memo.timestamp.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-white border border-gray-200 hover:border-blue-400 hover:bg-blue-50 text-gray-700 py-2.5 px-3 rounded-lg shadow-sm transition-all flex items-center justify-between group disabled:opacity-50 disabled:cursor-not-allowed';
                btn.onclick = () => initiateFetch(memo.id, btn);
                
                btn.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="font-mono font-bold text-blue-700">${memo.id}</span>
                        <span class="text-sm font-medium truncate">${memo.customer}</span>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        ${isNew ? `<span class="bg-red-100 text-red-700 border border-red-200 text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide">New</span>` : ''}
                        <span class="text-xs text-gray-400 group-hover:text-blue-500">${timeString}</span>
                    </div>
                `;
                memoButtonsContainer.appendChild(btn);
            });
        };

        // Initialize Render
        renderMemos();

        // Auto Refresh Logic (Every 5 seconds if idle & selection wrapper is visible)
        setInterval(() => {
            if (!isProcessing && !memoSelectionWrapper.classList.contains('hidden') && (Date.now() - lastActivityTime >= 5000)) {
                refreshIndicator.classList.remove('opacity-0');
                setTimeout(() => {
                    if (Math.random() < 0.2) {
                        const newId = '3' + Math.floor(100000 + Math.random() * 900000);
                        memos.unshift({ id: newId, customer: 'Auto-Sync Client', timestamp: new Date() });
                        if (memos.length > 6) memos.pop();
                    }
                    renderMemos();
                    refreshIndicator.classList.add('opacity-0');
                }, 800);
            }
        }, 5000);

        // --- Alert Handlers ---
        const showGlobalAlert = (type, message) => {
            globalAlert.classList.remove('hidden');
            globalAlert.classList.add('flex');
            if (type === 'success') {
                globalAlert.className = 'px-4 py-3 rounded-lg relative mb-4 flex items-center justify-center gap-2 border mt-4 bg-green-50 border-green-200 text-green-700 transition-all';
                document.getElementById('global-alert-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            } else if (type === 'error') {
                globalAlert.className = 'px-4 py-3 rounded-lg relative mb-4 flex items-center justify-center gap-2 border mt-4 bg-red-50 border-red-200 text-red-700 transition-all';
                document.getElementById('global-alert-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            }
            document.getElementById('global-alert-text').textContent = message;
        };

        const hideGlobalAlert = () => {
            globalAlert.classList.add('hidden');
            globalAlert.classList.remove('flex');
        };

        const showResetButton = () => { resetBtn.classList.remove('hidden'); };
        memoInput.addEventListener('input', () => { showResetButton(); hideGlobalAlert(); });

        // --- Core Fetch Logic ---
        const initiateFetch = (memoVal, clickedBtn = null) => {
            if (isProcessing) return;
            
            showResetButton(); 
            hideGlobalAlert();
            memoInput.value = memoVal; 
            
            if (!memoVal.trim() || memoVal.length !== 7 || !memoVal.startsWith('3')) {
                showGlobalAlert('error', 'Invalid Format: Memo must be 7 digits starting with 3.');
                return;
            }
            
            isProcessing = true;
            memoInput.disabled = true;
            Array.from(memoButtonsContainer.children).forEach(b => b.disabled = true);
            
            // UI Loading state
            if (clickedBtn) {
                clickedBtn.classList.add('bg-blue-50', 'border-blue-400');
                clickedBtn.innerHTML += `<svg class="animate-spin w-4 h-4 text-blue-600 ml-2" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32" stroke-linecap="round"></circle></svg>`;
            } else {
                fetchBtn.innerHTML = '<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32" stroke-linecap="round"></circle></svg>';
            }
            fetchBtn.disabled = true;
            successSection.classList.add('hidden');
            
            if (fetchTimeout) clearTimeout(fetchTimeout);

            fetchTimeout = setTimeout(() => {
                isProcessing = false;
                
                if (memoVal === '3000003') {
                    // ERROR Trigger
                    showGlobalAlert('error', 'Network Timeout: Failed to fetch memo 3000003.');
                    memoInput.disabled = false;
                    fetchBtn.innerHTML = 'Fetch';
                    fetchBtn.disabled = false;
                    renderMemos(); // Re-render to clear loading spinners
                } else {
                    // SUCCESS Trigger
                    showGlobalAlert('success', `Data block fetched successfully.`);
                    
                    // Retrieve memo data (or fallback for manual entry)
                    const foundMemo = memos.find(m => m.id === memoVal);
                    const customer = foundMemo ? foundMemo.customer : 'Manual Entry Client';
                    const time = foundMemo ? foundMemo.timestamp : new Date();
                    
                    // Populate Active Memo UI
                    document.getElementById('active-memo-id').textContent = memoVal;
                    document.getElementById('active-memo-customer').textContent = customer;
                    document.getElementById('active-memo-time').textContent = time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    
                    // HIDE Selection, SHOW Active Info
                    memoSelectionWrapper.classList.add('hidden');
                    activeMemoDetails.classList.remove('hidden');
                    
                    successSection.classList.remove('hidden');
                    resetHardwareUI();
                }
            }, 1200);
        };

        fetchBtn.addEventListener('click', () => initiateFetch(memoInput.value));
        memoInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') initiateFetch(memoInput.value); });

        // --- Hardware Connection Logic ---
        const resetHardwareUI = () => {
            deviceSelectionWrapper.classList.remove('hidden');
            activeDeviceDisplay.classList.add('hidden');
            
            deviceBtns.forEach(btn => {
                btn.disabled = false;
                btn.className = 'device-btn flex-1 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-2.5 px-1 rounded-lg text-xs sm:text-sm transition-all shadow-sm';
                btn.innerHTML = btn.getAttribute('data-id') === 'reader1' ? 'Reader 1 (Main)' : 
                                btn.getAttribute('data-id') === 'reader2' ? 'Reader 2 (Desk)' : 'Reader 3 (Sec)';
            });
            connectionStatusTemp.textContent = 'Awaiting Hardware Selection';
            connectionStatusTemp.className = 'text-sm font-semibold text-gray-400';
            ledBtn.classList.add('hidden');
        };

        deviceBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isProcessing) return;
                hideGlobalAlert();

                const readerId = btn.getAttribute('data-id');
                const readerName = readerId === 'reader1' ? 'Reader 1 (Main)' : readerId === 'reader2' ? 'Reader 2 (Desk)' : 'Reader 3 (Sec)';
                isProcessing = true;

                deviceBtns.forEach(b => {
                    b.disabled = true;
                    b.classList.replace('border-gray-300', 'border-gray-200');
                    b.classList.replace('text-gray-700', 'text-gray-400');
                });
                
                btn.classList.replace('bg-gray-50', 'bg-amber-50');
                btn.classList.replace('border-gray-200', 'border-amber-300');
                btn.classList.replace('text-gray-400', 'text-amber-700');
                
                btn.innerHTML = `
                    <div class="flex items-center justify-center gap-1.5">
                        <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span></span>
                        Connecting...
                    </div>
                `;

                connectionStatusTemp.textContent = 'Establishing connection...';
                connectionStatusTemp.className = 'text-sm font-semibold text-amber-600 animate-pulse';

                if (connectionTimeout) clearTimeout(connectionTimeout);

                connectionTimeout = setTimeout(() => {
                    isProcessing = false;
                    
                    if (readerId === 'reader2') {
                        // ERROR trigger
                        connectionStatusTemp.textContent = 'Connection Timeout - Reader not responding';
                        connectionStatusTemp.className = 'text-sm font-semibold text-red-600';
                        
                        deviceBtns.forEach(b => {
                            b.disabled = false;
                            b.classList.replace('border-gray-200', 'border-gray-300');
                            b.classList.replace('text-gray-400', 'text-gray-700');
                        });
                        btn.innerHTML = readerName;
                        btn.classList.replace('bg-amber-50', 'bg-red-50');
                        btn.classList.replace('border-amber-300', 'border-red-300');
                        btn.classList.replace('text-amber-700', 'text-red-700');
                    } else {
                        // SUCCESS trigger
                        document.getElementById('active-device-name').textContent = readerName;
                        
                        // Hide selection wrapper, show active device box
                        deviceSelectionWrapper.classList.add('hidden');
                        activeDeviceDisplay.classList.remove('hidden');
                        ledBtn.classList.remove('hidden');
                    }
                }, 2000);
            });
        });

        // --- LED Toggle Logic ---
        ledBtn.addEventListener('click', () => {
            if (ledBtn.dataset.state === 'off') {
                ledBtn.dataset.state = 'on';
                ledBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Turn LED Off';
                ledBtn.classList.replace('bg-amber-500', 'bg-green-500');
                ledBtn.classList.replace('hover:bg-amber-600', 'hover:bg-green-600');
            } else {
                ledBtn.dataset.state = 'off';
                ledBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Turn LED On';
                ledBtn.classList.replace('bg-green-500', 'bg-amber-500');
                ledBtn.classList.replace('hover:bg-green-600', 'hover:bg-amber-600');
            }
        });

        // --- Reset Logic ---
        resetBtn.addEventListener('click', () => {
            if (fetchTimeout) clearTimeout(fetchTimeout);
            if (connectionTimeout) clearTimeout(connectionTimeout);
            isProcessing = false;

            // Reset States
            memoInput.value = '';
            memoInput.disabled = false;
            fetchBtn.innerHTML = 'Fetch';
            fetchBtn.disabled = false;
            
            // Restore visibilities
            memoSelectionWrapper.classList.remove('hidden');
            activeMemoDetails.classList.add('hidden');
            
            hideGlobalAlert();
            successSection.classList.add('hidden');
            resetBtn.classList.add('hidden'); 
            
            // Restore LED
            ledBtn.dataset.state = 'off';
            ledBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Turn LED On';
            ledBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
            ledBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');
            
            resetHardwareUI();
            renderMemos();
            lastActivityTime = Date.now();
        });
    </script>
</body>
</html>
