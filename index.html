<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Control System - Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #f8fafc; }
        .main-section { height: 100vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="main-section w-full">
        <div class="bg-white p-5 sm:p-6 rounded-xl shadow-lg w-full max-w-lg border border-gray-100 my-auto flex-shrink-0">
            
            <!-- HEADER -->
            <div class="mb-3 text-center">
                <h1 class="text-xl font-bold text-gray-800 leading-tight">Memo Retrieval System</h1>
                <p class="text-xs text-gray-500 mt-0.5">Select a recent memo to issue inventory, or enter manually.</p>
            </div>

            <!-- MEMO SELECTION UI -->
            <div id="ui-selection">
                <div class="mb-5">
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-sm font-bold text-gray-800">Recent Issued Memos</label>
                        <span id="refresh-indicator" class="text-xs text-gray-400 flex items-center gap-1 opacity-0 transition-opacity">
                            <svg class="animate-spin w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32" stroke-linecap="round"></circle></svg> Syncing...
                        </span>
                    </div>
                    <div id="memo-list-container" class="flex flex-col gap-2 max-h-48 overflow-y-auto custom-scrollbar pr-1"></div>
                </div>

                <div class="relative flex py-1 items-center mb-3">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-[10px] uppercase font-bold tracking-wider">Or Manual Entry</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <div class="flex flex-col sm:flex-row gap-2 mb-1">
                    <div class="w-full relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </div>
                        <input type="text" id="memo-input" placeholder="Enter 7-digit memo (e.g., 3124567)" class="w-full pl-9 border-gray-300 bg-gray-50 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border outline-none text-sm text-gray-700 disabled:bg-gray-100 disabled:text-gray-400">
                    </div>
                    <button id="btn-fetch" class="sm:w-28 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 rounded-lg transition duration-200 shadow-sm flex justify-center items-center gap-2 text-sm disabled:opacity-75 disabled:cursor-not-allowed">Fetch</button>
                </div>
            </div>

            <!-- ACTIVE MEMO DETAILS -->
            <div id="ui-active-memo" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-4 mb-2 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 right-0 w-16 h-16 bg-blue-100 rounded-bl-full -mr-8 -mt-8 z-0"></div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-bold text-blue-500 uppercase tracking-wider">Active Memo</span>
                        <span id="active-memo-time" class="text-[10px] text-blue-600 font-bold bg-blue-100 border border-blue-200 px-2 py-0.5 rounded"></span>
                    </div>
                    <h2 id="active-memo-id" class="text-xl font-black text-blue-900 font-mono tracking-tight"></h2>
                    <p id="active-memo-customer" class="text-xs font-semibold text-blue-700 mt-0.5"></p>
                    
                    <div class="mt-3 border-t border-blue-200 pt-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-blue-800 uppercase tracking-wider flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                Piece Details
                            </span>
                        </div>
                        
                        <div id="tabs-container" class="flex gap-1.5 mb-2.5 overflow-x-auto pb-1 custom-scrollbar"></div>
                        <div id="pieces-container" class="flex flex-col gap-1.5 max-h-56 overflow-y-auto custom-scrollbar pr-1.5 pb-1"></div>
                    </div>
                </div>
            </div>

            <!-- DYNAMIC GLOBAL ALERT -->
            <div id="ui-alert" class="hidden px-3 py-2 rounded-lg relative mb-3 flex items-center justify-center gap-2 border mt-3 transition-all text-xs font-semibold">
                <svg id="alert-icon" class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
                <span id="alert-text"></span>
            </div>

            <!-- HARDWARE UI -->
            <div id="ui-hardware" class="hidden border-t border-gray-100 pt-4 mt-3">
                <div class="flex flex-col gap-3">
                    <div id="hw-selector-wrapper">
                        <label class="block text-xs font-bold text-gray-800 mb-2">Select Hardware Interface</label>
                        <div class="flex gap-2" id="hw-buttons">
                            <button class="hw-btn flex-1 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-2 px-1 rounded-lg text-xs transition-all shadow-sm" data-id="reader1">Reader 1 (Main)</button>
                            <button class="hw-btn flex-1 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-2 px-1 rounded-lg text-xs transition-all shadow-sm" data-id="reader2">Reader 2 (Desk)</button>
                            <button class="hw-btn flex-1 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-2 px-1 rounded-lg text-xs transition-all shadow-sm" data-id="reader3">Reader 3 (Sec)</button>
                        </div>
                        <div class="flex items-center gap-2 mt-2">
                            <span class="text-xs font-medium text-gray-500">Status:</span>
                            <span id="hw-status-text" class="text-xs font-semibold text-gray-400">Awaiting Hardware Selection</span>
                        </div>
                    </div>

                    <div id="hw-active-display" class="hidden items-center justify-between bg-green-50 border border-green-200 p-2.5 rounded-lg">
                        <div class="flex items-center gap-2">
                            <span class="flex h-2.5 w-2.5 relative">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                            </span>
                            <span id="hw-active-name" class="font-bold text-green-800 text-xs"></span>
                        </div>
                        <span class="text-[10px] font-bold text-green-700 uppercase tracking-wide bg-green-100 px-1.5 py-0.5 rounded">Connected</span>
                    </div>

                    <button id="btn-led" class="hidden w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-4 rounded-lg transition-colors shadow-md flex justify-center items-center gap-2 text-sm">
                        <svg id="led-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <span id="led-text">Turn LED On</span>
                    </button>
                </div>
            </div>

            <!-- RESET BUTTON -->
            <div class="mt-4 pt-3 flex justify-center border-t border-gray-100 min-h-[40px]">
                <button id="btn-reset" class="hidden items-center gap-1.5 text-xs text-red-500 hover:text-red-700 font-bold transition-colors bg-red-50 hover:bg-red-100 px-4 py-1.5 rounded-full border border-red-100">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reset System
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. STATE MANAGEMENT ---
        const AppState = {
            memos: [],
            activeMemo: null,
            currentTab: 'all', // 'all', 'pending', 'found', 'not-found'
            isProcessing: false,
            ledOn: false,
            lastActivity: Date.now()
        };

        // --- 2. CACHED DOM ELEMENTS ---
        const DOM = {
            uiSel: document.getElementById('ui-selection'),
            uiActMemo: document.getElementById('ui-active-memo'),
            uiHw: document.getElementById('ui-hardware'),
            uiAlert: document.getElementById('ui-alert'),
            memoList: document.getElementById('memo-list-container'),
            memoInp: document.getElementById('memo-input'),
            btnFetch: document.getElementById('btn-fetch'),
            btnReset: document.getElementById('btn-reset'),
            tabsContainer: document.getElementById('tabs-container'),
            piecesContainer: document.getElementById('pieces-container'),
            syncInd: document.getElementById('refresh-indicator'),
            // Hardware
            hwWrapper: document.getElementById('hw-selector-wrapper'),
            hwBtnsContainer: document.getElementById('hw-buttons'),
            hwStatusText: document.getElementById('hw-status-text'),
            hwActiveDisp: document.getElementById('hw-active-display'),
            hwActiveName: document.getElementById('hw-active-name'),
            btnLed: document.getElementById('btn-led'),
            ledIcon: document.getElementById('led-icon'),
            ledText: document.getElementById('led-text')
        };

        // --- 3. UTILITIES & DATA GEN ---
        const SVGS = {
            spinner: `<circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32" stroke-linecap="round"></circle>`,
            check: `<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>`,
            cross: `<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>`
        };

        const genPieces = (count) => {
            const shapes = ['Round', 'Princess', 'Oval', 'Cushion', 'Emerald'];
            const colors = ['D', 'E', 'F', 'G', 'H'];
            const clarities = ['IF', 'VVS1', 'VVS2', 'VS1', 'VS2', 'SI1'];
            return Array.from({ length: count }, () => ({
                id: 'VD' + Math.floor(100000 + Math.random() * 900000),
                shape: shapes[Math.floor(Math.random() * shapes.length)],
                carat: (Math.random() * 2 + 0.5).toFixed(2),
                color: colors[Math.floor(Math.random() * colors.length)],
                clarity: clarities[Math.floor(Math.random() * clarities.length)],
                status: 'pending'
            }));
        };

        const initMockData = () => {
            AppState.memos = [
                { id: '3128492', customer: 'Venus Impex', timestamp: new Date(Date.now() - 120000), pieces: genPieces(6) }, 
                { id: '3128491', customer: 'Finestar Jewellery', timestamp: new Date(Date.now() - 900000), pieces: genPieces(4) },
                { id: '3128490', customer: 'Kiran Gems', timestamp: new Date(Date.now() - 2700000), pieces: genPieces(8) },
                { id: '3000003', customer: 'Error Test Co.', timestamp: new Date(Date.now() - 7200000), pieces: [] } 
            ];
        };

        // --- 4. CORE LOGIC & RENDERING ---
        
        // Render Recent Memos List (Optimized String Builder)
        const renderMemoList = () => {
            const now = Date.now();
            DOM.memoList.innerHTML = AppState.memos.map(m => {
                const isNew = (now - m.timestamp.getTime()) <= 300000;
                return `
                <button data-id="${m.id}" class="w-full text-left bg-white border border-gray-200 hover:border-blue-400 hover:bg-blue-50 text-gray-700 py-2 px-2.5 rounded-lg shadow-sm transition-all flex items-center justify-between group disabled:opacity-50 disabled:cursor-not-allowed">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <span class="font-mono font-bold text-blue-700 text-sm">${m.id}</span>
                        <span class="text-xs font-medium truncate">${m.customer}</span>
                    </div>
                    <div class="flex items-center gap-1.5 flex-shrink-0">
                        ${isNew ? '<span class="bg-red-100 text-red-700 border border-red-200 text-[9px] font-bold px-1 py-0.5 rounded uppercase tracking-wide">New</span>' : ''}
                        <span class="text-[10px] text-gray-400 group-hover:text-blue-500">${m.timestamp.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                </button>`;
            }).join('');
        };

        // DB Persistence (localStorage)
        const persistMemoState = (load = false) => {
            if (!AppState.activeMemo) return;
            const key = 'vj_memo_' + AppState.activeMemo.id;
            
            if (load) {
                try {
                    const saved = JSON.parse(localStorage.getItem(key));
                    if (saved && Array.isArray(saved)) {
                        AppState.activeMemo.pieces.forEach(p => {
                            const match = saved.find(s => s.id === p.id);
                            if (match) p.status = match.status;
                        });
                    }
                } catch(e) {}
            } else {
                const mapToSave = AppState.activeMemo.pieces.map(p => ({ id: p.id, status: p.status }));
                localStorage.setItem(key, JSON.stringify(mapToSave));
            }
        };

        // Render Tabs (Dynamic evaluation)
        const renderTabs = () => {
            if (!AppState.activeMemo) return;
            
            const pieces = AppState.activeMemo.pieces;
            const counts = { all: pieces.length, pending: 0, found: 0, 'not-found': 0 };
            pieces.forEach(p => counts[p.status]++);

            // Fallback if current tab drops to 0
            if (counts[AppState.currentTab] === 0 && AppState.currentTab !== 'all') {
                const available = Object.keys(counts).find(k => counts[k] > 0);
                AppState.currentTab = available || 'all';
            }

            const tabsHTML = Object.keys(counts).map(key => {
                if (counts[key] === 0) return '';
                const isActive = AppState.currentTab === key;
                const label = key === 'not-found' ? 'Not Found' : key.charAt(0).toUpperCase() + key.slice(1);
                
                return `
                <button data-tab="${key}" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 border shadow-sm ${isActive ? 'bg-blue-600 text-white border-blue-600 shadow' : 'bg-white text-gray-700 border-gray-200 hover:bg-blue-50 hover:border-blue-300'}">
                    <span>${label}</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded-full leading-none flex items-center justify-center ${isActive ? 'bg-blue-700 text-white' : 'bg-gray-100 text-gray-600'}">${counts[key]}</span>
                </button>`;
            }).join('');

            DOM.tabsContainer.innerHTML = tabsHTML;
        };

        // Render Pieces (Event Delegated, highly efficient)
        const renderPieces = () => {
            renderTabs();
            if (!AppState.activeMemo) return;

            const filtered = AppState.activeMemo.pieces.filter(p => AppState.currentTab === 'all' || p.status === AppState.currentTab);

            if (filtered.length === 0) {
                DOM.piecesContainer.innerHTML = '<div class="text-center py-6 text-xs text-gray-400 italic bg-white border border-gray-100 rounded-lg shadow-sm">No items found in this tab.</div>';
                return;
            }

            DOM.piecesContainer.innerHTML = filtered.map(p => {
                const f = p.status === 'found';
                const nf = p.status === 'not-found';
                
                // Constructing class strings
                const rowClass = `flex items-center p-2.5 border rounded-lg transition-colors shadow-sm relative ${f ? 'bg-green-50 border-green-200' : nf ? 'bg-red-50 border-red-200' : 'bg-white border-blue-100 hover:bg-blue-50'}`;
                const textClass = `font-mono font-bold text-xs transition-all ${f ? 'text-green-800 line-through opacity-70' : nf ? 'text-red-800 line-through opacity-70' : 'text-gray-800'}`;
                const foundBtnClass = `w-5 h-5 rounded border-[1.5px] flex items-center justify-center transition-colors cursor-pointer mr-2.5 focus:outline-none focus:ring-2 focus:ring-green-400 ${f ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 text-gray-300 hover:border-green-400 hover:text-green-400 bg-white'}`;
                const notFoundBtnClass = `w-5 h-5 rounded border-[1.5px] flex items-center justify-center transition-colors cursor-pointer ml-2.5 focus:outline-none focus:ring-2 focus:ring-red-400 ${nf ? 'bg-red-500 border-red-500 text-white' : 'border-gray-300 text-gray-300 hover:border-red-400 hover:text-red-400 bg-white'}`;
                
                const badge = f ? `<span class="hidden sm:inline-block ml-2 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide bg-green-200 text-green-800">Found</span>` 
                            : nf ? `<span class="hidden sm:inline-block ml-2 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide bg-red-200 text-red-800">Missing</span>` : '';

                return `
                <div class="${rowClass}">
                    <button data-action="toggle-found" data-id="${p.id}" class="flex-shrink-0 ${foundBtnClass}"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">${SVGS.check}</svg></button>
                    <div class="flex-1 flex flex-col sm:items-start text-left">
                        <div class="flex items-center"><span class="${textClass}">${p.id}</span>${badge}</div>
                        <span class="text-[10px] ${p.status === 'pending' ? 'text-gray-500' : 'text-gray-500 opacity-70'} font-medium mt-0.5">${p.shape} • <span class="${p.status==='pending'?'text-blue-600':''} font-bold">${p.carat}ct</span> • ${p.color} • ${p.clarity}</span>
                    </div>
                    <button data-action="toggle-notfound" data-id="${p.id}" class="flex-shrink-0 ${notFoundBtnClass}"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">${SVGS.cross}</svg></button>
                </div>`;
            }).join('');
        };

        const toggleAlert = (type, msg) => {
            if (!msg) { DOM.uiAlert.classList.replace('flex', 'hidden'); return; }
            DOM.uiAlert.classList.replace('hidden', 'flex');
            DOM.uiAlert.className = `px-3 py-2 rounded-lg relative mb-3 flex items-center justify-center gap-2 border mt-3 transition-all text-xs font-semibold ${type === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-green-50 border-green-200 text-green-700'}`;
            document.getElementById('alert-icon').innerHTML = type === 'error' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>' : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            document.getElementById('alert-text').textContent = msg;
        };

        const fetchMemo = (id) => {
            if (AppState.isProcessing) return;
            toggleAlert();
            DOM.btnReset.classList.replace('hidden', 'flex');

            if (!/^3\d{6}$/.test(id)) return toggleAlert('error', 'Invalid Format: Memo must be 7 digits starting with 3.');

            AppState.isProcessing = true;
            DOM.memoInp.disabled = true;
            DOM.memoInp.value = id;
            DOM.btnFetch.disabled = true;
            DOM.btnFetch.innerHTML = `<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">${SVGS.spinner}</svg>`;
            document.querySelectorAll('#memo-list-container button').forEach(b => b.disabled = true);

            setTimeout(() => {
                AppState.isProcessing = false;
                DOM.memoInp.disabled = false;
                DOM.btnFetch.disabled = false;
                DOM.btnFetch.innerHTML = 'Fetch';
                document.querySelectorAll('#memo-list-container button').forEach(b => b.disabled = false);

                if (id === '3000003') return toggleAlert('error', 'Network Timeout: Failed to fetch memo.');

                toggleAlert('success', 'Data block fetched successfully.');

                const rawMemo = AppState.memos.find(m => m.id === id) || { id, customer: 'Manual Entry', timestamp: new Date(), pieces: genPieces(5) };
                
                AppState.activeMemo = JSON.parse(JSON.stringify(rawMemo));
                
                // Sort array ONCE on load
                AppState.activeMemo.pieces.sort((a, b) => a.shape.localeCompare(b.shape) || parseFloat(b.carat) - parseFloat(a.carat));
                
                persistMemoState(true); // Load saved state
                AppState.currentTab = 'all';

                document.getElementById('active-memo-id').textContent = id;
                document.getElementById('active-memo-customer').textContent = AppState.activeMemo.customer;
                document.getElementById('active-memo-time').textContent = AppState.activeMemo.timestamp.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                DOM.uiSel.classList.add('hidden');
                DOM.uiActMemo.classList.remove('hidden');
                DOM.uiHw.classList.remove('hidden');
                
                renderPieces();
            }, 1000);
        };

        const resetApp = () => {
            AppState.activeMemo = null;
            AppState.currentTab = 'all';
            AppState.isProcessing = false;
            
            DOM.memoInp.value = '';
            toggleAlert();
            DOM.btnReset.classList.replace('flex', 'hidden');
            
            DOM.uiSel.classList.remove('hidden');
            DOM.uiActMemo.classList.add('hidden');
            DOM.uiHw.classList.add('hidden');

            // Reset Hardware UI
            DOM.hwWrapper.classList.remove('hidden');
            DOM.hwActiveDisp.classList.replace('flex', 'hidden');
            DOM.btnLed.classList.add('hidden');
            AppState.ledOn = false;
            DOM.btnLed.className = 'hidden w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-4 rounded-lg transition-colors shadow-md justify-center items-center gap-2 text-sm';
            DOM.ledText.textContent = 'Turn LED On';
            
            document.querySelectorAll('.hw-btn').forEach(b => {
                b.disabled = false;
                b.className = 'hw-btn flex-1 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-2 px-1 rounded-lg text-xs transition-all shadow-sm';
                b.innerHTML = b.getAttribute('data-id').replace('reader', 'Reader ');
            });
            DOM.hwStatusText.className = 'text-xs font-semibold text-gray-400';
            DOM.hwStatusText.textContent = 'Awaiting Hardware Selection';

            renderMemoList();
        };

        // --- 5. EVENT LISTENERS (Delegated) ---

        // Selection List clicks
        DOM.memoList.addEventListener('click', e => {
            const btn = e.target.closest('button[data-id]');
            if (btn) fetchMemo(btn.dataset.id);
        });

        // Tab clicks
        DOM.tabsContainer.addEventListener('click', e => {
            const btn = e.target.closest('button[data-tab]');
            if (btn) {
                AppState.currentTab = btn.dataset.tab;
                renderPieces();
            }
        });

        // Piece Status Toggles
        DOM.piecesContainer.addEventListener('click', e => {
            const btn = e.target.closest('button[data-action]');
            if (!btn || !AppState.activeMemo) return;
            
            const piece = AppState.activeMemo.pieces.find(p => p.id === btn.dataset.id);
            if (!piece) return;

            const action = btn.dataset.action === 'toggle-found' ? 'found' : 'not-found';
            piece.status = piece.status === action ? 'pending' : action;
            
            persistMemoState(false); // Save to DB
            renderPieces(); // Instant UI update
        });

        // Search inputs
        DOM.btnFetch.addEventListener('click', () => fetchMemo(DOM.memoInp.value));
        DOM.memoInp.addEventListener('keypress', e => e.key === 'Enter' && fetchMemo(DOM.memoInp.value));
        DOM.memoInp.addEventListener('input', () => { DOM.btnReset.classList.replace('hidden', 'flex'); toggleAlert(); });

        // Hardware Selection
        DOM.hwBtnsContainer.addEventListener('click', e => {
            if (AppState.isProcessing) return;
            const btn = e.target.closest('.hw-btn');
            if (!btn) return;

            AppState.isProcessing = true;
            document.querySelectorAll('.hw-btn').forEach(b => {
                b.disabled = true;
                b.classList.replace('border-gray-300', 'border-gray-200');
                b.classList.replace('text-gray-700', 'text-gray-400');
            });

            btn.classList.replace('bg-gray-50', 'bg-amber-50');
            btn.classList.replace('border-gray-200', 'border-amber-300');
            btn.classList.replace('text-gray-400', 'text-amber-700');
            btn.innerHTML = `<div class="flex items-center justify-center gap-1.5"><svg class="animate-spin w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor">${SVGS.spinner}</svg>Connecting</div>`;
            
            DOM.hwStatusText.className = 'text-xs font-semibold text-amber-600 animate-pulse';
            DOM.hwStatusText.textContent = 'Establishing connection...';

            setTimeout(() => {
                AppState.isProcessing = false;
                if (btn.dataset.id === 'reader2') {
                    DOM.hwStatusText.className = 'text-xs font-semibold text-red-600';
                    DOM.hwStatusText.textContent = 'Timeout - Reader not responding';
                    document.querySelectorAll('.hw-btn').forEach(b => {
                        b.disabled = false;
                        b.classList.replace('border-gray-200', 'border-gray-300');
                        b.classList.replace('text-gray-400', 'text-gray-700');
                    });
                    btn.innerHTML = 'Reader 2 (Desk)';
                    btn.classList.replace('bg-amber-50', 'bg-red-50');
                    btn.classList.replace('border-amber-300', 'border-red-300');
                    btn.classList.replace('text-amber-700', 'text-red-700');
                } else {
                    DOM.hwWrapper.classList.add('hidden');
                    DOM.hwActiveDisp.classList.replace('hidden', 'flex');
                    DOM.hwActiveName.textContent = btn.dataset.id === 'reader1' ? 'Reader 1 (Main)' : 'Reader 3 (Sec)';
                    DOM.btnLed.classList.replace('hidden', 'flex');
                }
            }, 1500);
        });

        // LED Toggle
        DOM.btnLed.addEventListener('click', () => {
            AppState.ledOn = !AppState.ledOn;
            if (AppState.ledOn) {
                DOM.btnLed.classList.replace('bg-amber-500', 'bg-green-500');
                DOM.btnLed.classList.replace('hover:bg-amber-600', 'hover:bg-green-600');
                DOM.ledText.textContent = 'Turn LED Off';
            } else {
                DOM.btnLed.classList.replace('bg-green-500', 'bg-amber-500');
                DOM.btnLed.classList.replace('hover:bg-green-600', 'hover:bg-amber-600');
                DOM.ledText.textContent = 'Turn LED On';
            }
        });

        // Reset App
        DOM.btnReset.addEventListener('click', resetApp);

        // Activity Monitor & Auto-Sync
        ['mousemove', 'keydown', 'touchstart'].forEach(evt => window.addEventListener(evt, () => AppState.lastActivity = Date.now()));
        
        setInterval(() => {
            if (!AppState.activeMemo && !AppState.isProcessing && Date.now() - AppState.lastActivity > 5000) {
                DOM.syncInd.classList.remove('opacity-0');
                setTimeout(() => {
                    if (Math.random() < 0.2) {
                        AppState.memos.unshift({ id: '3' + Math.floor(100000 + Math.random() * 900000), customer: 'Auto-Sync Client', timestamp: new Date(), pieces: genPieces(5) });
                        if (AppState.memos.length > 6) AppState.memos.pop();
                        renderMemoList();
                    }
                    DOM.syncInd.classList.add('opacity-0');
                }, 800);
            }
        }, 5000);

        // Initialize App
        initMockData();
        renderMemoList();
    </script>
</body>
</html>
