<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Control System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ensure no scrolling on the body itself to enforce the 80/20 split */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: sans-serif; 
        }
        
        /* 80vh container for the main application, allows scrolling inside if needed */
        .top-section { 
            height: 80vh; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background-color: #f3f4f6; 
            padding: 1rem; 
        }
        
        /* 20vh container at the bottom */
        .bottom-section { 
            height: 20vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #e5e7eb; 
            border-top: 2px solid #d1d5db; 
        }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Memo Control System</h1>

            <!-- Search / Fetch Section -->
            <div class="flex flex-col gap-4 mb-6">
                <div>
                    <label for="recent-memos" class="block text-sm font-medium text-gray-700 mb-1">Recent Memos</label>
                    <select id="recent-memos" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border outline-none">
                        <option value="" disabled selected>Recent Memo</option>
                        <!-- Options populated via JS -->
                    </select>
                </div>

                <div>
                    <label for="memo-input" class="block text-sm font-medium text-gray-700 mb-1">Memo Number</label>
                    <div class="flex gap-2">
                        <input type="text" id="memo-input" placeholder="Enter memo number" class="flex-1 border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border outline-none">
                        <button id="fetch-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition duration-150">Fetch</button>
                    </div>
                </div>
            </div>

            <!-- Success / Device Section (Hidden by default) -->
            <div id="success-section" class="hidden border-t border-gray-200 pt-5 mt-2">
                <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-5" role="alert">
                    <span class="block sm:inline font-semibold">✓ Memo fetched successfully.</span>
                </div>

                <div class="flex flex-col gap-4">
                    <div>
                        <label for="rfid-reader" class="block text-sm font-medium text-gray-700 mb-1">RFID Reader</label>
                        <div class="flex gap-2">
                            <select id="rfid-reader" class="flex-1 border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border outline-none">
                                <option value="" disabled selected>Select a reader</option>
                                <option value="reader1">Reader A (Desk 1)</option>
                                <option value="reader2">Reader B (Desk 2)</option>
                                <option value="reader3">Reader C (Vault)</option>
                            </select>
                            <button id="connect-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-md transition duration-150">Connect</button>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-sm font-medium text-gray-700">Status:</span>
                        <span id="connection-status" class="text-sm font-semibold text-red-600">Not Connected</span>
                    </div>

                    <!-- LED Button (Hidden until connected) -->
                    <button id="led-btn" class="hidden w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-md transition duration-150 shadow">
                        Turn LED On
                    </button>
                </div>
            </div>

            <!-- Reset Button -->
            <div class="mt-8 pt-4 text-center border-t border-gray-100">
                <button id="reset-btn" class="text-sm text-gray-500 hover:text-gray-800 underline transition-colors">Reset System</button>
            </div>
        </div>
    </div>

    <!-- 20% Bottom Inactive Area -->
    <div class="bottom-section">
        <h2 class="text-xl sm:text-2xl font-bold text-gray-400 uppercase tracking-widest text-center px-4">
            Venus Jewel Diamond Finding Form
        </h2>
    </div>

    <script>
        // Sample Memo Data - generate timestamps dynamically so they are always recent
        const now = new Date();
        const memos = [
            { id: 'M-9021', timestamp: new Date(now.getTime() - 1000 * 60 * 5) },      // 5 mins ago
            { id: 'M-9020', timestamp: new Date(now.getTime() - 1000 * 60 * 35) },     // 35 mins ago
            { id: 'M-9019', timestamp: new Date(now.getTime() - 1000 * 60 * 60 * 2) }, // 2 hours ago
            { id: 'M-9018', timestamp: new Date(now.getTime() - 1000 * 60 * 60 * 24) } // 1 day ago
        ];

        // Ensure descending order (newest first)
        memos.sort((a, b) => b.timestamp - a.timestamp);

        // DOM Elements
        const memoSelect = document.getElementById('recent-memos');
        const memoInput = document.getElementById('memo-input');
        const fetchBtn = document.getElementById('fetch-btn');
        const successSection = document.getElementById('success-section');
        const rfidReader = document.getElementById('rfid-reader');
        const connectBtn = document.getElementById('connect-btn');
        const connectionStatus = document.getElementById('connection-status');
        const ledBtn = document.getElementById('led-btn');
        const resetBtn = document.getElementById('reset-btn');

        // Populate Recent Memos Dropdown
        memos.forEach(memo => {
            const option = document.createElement('option');
            option.value = memo.id;
            
            // Format time nicely
            const timeString = memo.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateString = memo.timestamp.toLocaleDateString([], { month: 'short', day: 'numeric' });
            
            option.textContent = `${memo.id} - ${dateString} ${timeString}`;
            memoSelect.appendChild(option);
        });

        // Event: Select Memo from Dropdown
        memoSelect.addEventListener('change', (e) => {
            memoInput.value = e.target.value;
        });

        // Event: Fetch Button Click
        fetchBtn.addEventListener('click', () => {
            if (!memoInput.value.trim()) {
                alert('Please enter or select a memo number.');
                return;
            }
            
            // Simulate Fetching state
            fetchBtn.textContent = 'Fetching...';
            fetchBtn.disabled = true;
            fetchBtn.classList.add('opacity-75', 'cursor-not-allowed');

            setTimeout(() => {
                // Remove loading states
                fetchBtn.textContent = 'Fetch';
                fetchBtn.disabled = false;
                fetchBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                
                // Hide fetch button and show success area
                fetchBtn.classList.add('hidden'); 
                successSection.classList.remove('hidden');
            }, 1500);
        });

        // Event: Connect RFID Reader Button Click
        connectBtn.addEventListener('click', () => {
            if (!rfidReader.value) {
                alert('Please select an RFID reader from the dropdown first.');
                return;
            }

            // Simulate Connecting state
            connectBtn.textContent = '...';
            connectBtn.disabled = true;
            connectBtn.classList.add('opacity-75', 'cursor-not-allowed');
            
            connectionStatus.textContent = 'Connecting...';
            connectionStatus.className = 'text-sm font-semibold text-yellow-600 animate-pulse';
            
            // Disable dropdown while connecting
            rfidReader.disabled = true;

            setTimeout(() => {
                // Connection successful state
                connectionStatus.textContent = 'Connected';
                connectionStatus.className = 'text-sm font-semibold text-green-600';
                
                // Hide connect button, show LED button
                connectBtn.classList.add('hidden'); 
                ledBtn.classList.remove('hidden'); 
                
                // Keep dropdown disabled while connected to prevent changing reader mid-session
            }, 2000);
        });

        // Event: Turn LED On Button Click
        ledBtn.addEventListener('click', () => {
            // Visual feedback that the LED command was sent
            ledBtn.textContent = 'LED is ON';
            ledBtn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
            ledBtn.classList.add('bg-green-500', 'hover:bg-green-600');
            
            // Reset button visual after a few seconds
            setTimeout(() => {
                ledBtn.textContent = 'Turn LED On';
                ledBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                ledBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
            }, 3000);
        });

        // Event: Reset System
        resetBtn.addEventListener('click', () => {
            // Reset Inputs
            memoSelect.value = '';
            memoInput.value = '';
            
            // Reset Fetch Button
            fetchBtn.classList.remove('hidden');
            fetchBtn.textContent = 'Fetch';
            fetchBtn.disabled = false;
            fetchBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            
            // Hide Success Section
            successSection.classList.add('hidden');
            
            // Reset RFID & Connect Button
            rfidReader.value = '';
            rfidReader.disabled = false;
            connectBtn.classList.remove('hidden');
            connectBtn.textContent = 'Connect';
            connectBtn.disabled = false;
            connectBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            
            // Reset Status
            connectionStatus.textContent = 'Not Connected';
            connectionStatus.className = 'text-sm font-semibold text-red-600';
            
            // Reset and Hide LED Button
            ledBtn.classList.add('hidden');
            ledBtn.textContent = 'Turn LED On';
            ledBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
            ledBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
        });
    </script>
</body>
</html>
