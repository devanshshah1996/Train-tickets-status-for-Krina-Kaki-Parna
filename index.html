<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Control System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: sans-serif; 
        }
        .top-section { 
            height: 80vh; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background-color: #f8fafc; 
            padding: 1rem; 
        }
        .bottom-section { 
            height: 20vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #e2e8f0; 
            border-top: 2px solid #cbd5e1; 
        }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border border-gray-100">
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-bold text-gray-800">Memo Retrieval System</h1>
                <p class="text-sm text-gray-500 mt-1">Enter a memo number or select from recent history to fetch the data block.</p>
            </div>

            <!-- Search / Fetch Section -->
            <div class="flex flex-col gap-4 mb-2">
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="w-full sm:w-1/2">
                        <select id="recent-memos" class="w-full border-gray-300 bg-gray-50 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2.5 border outline-none text-sm text-gray-700">
                            <option value="" disabled selected>Select Recent Memo</option>
                            <!-- Options populated via JS -->
                        </select>
                    </div>

                    <div class="w-full sm:w-1/2 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </div>
                        <input type="text" id="memo-input" placeholder="Memo Number" class="w-full pl-9 border-gray-300 bg-gray-50 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2.5 border outline-none text-sm text-gray-700">
                    </div>
                </div>
                
                <button id="fetch-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-sm flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Fetch Data Block
                </button>
            </div>

            <!-- Dynamic Global Alert Box (Errors / Success Messages) -->
            <div id="global-alert" class="hidden px-4 py-3 rounded-lg relative mb-4 flex items-center justify-center gap-2 border mt-4 transition-all" role="alert">
                <svg id="global-alert-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
                <span id="global-alert-text" class="block sm:inline font-semibold"></span>
            </div>

            <!-- Hardware Section (Hidden by default, shown ONLY on fetch success) -->
            <div id="success-section" class="hidden border-t border-gray-100 pt-6 mt-2">
                <div class="flex flex-col gap-4">
                    <label class="block text-sm font-bold text-gray-800">Hardware Interface</label>
                    
                    <div class="flex flex-wrap items-center gap-3">
                        <select id="rfid-reader" class="flex-1 min-w-[140px] border-gray-300 bg-gray-50 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2.5 border outline-none text-sm text-gray-700">
                            <option value="" disabled selected>Select a reader</option>
                            <option value="reader1">Reader 1 (Main)</option>
                            <option value="reader2">Reader 2 (Desk)</option>
                            <option value="reader3">Reader 3 (Sec...)</option>
                        </select>
                        
                        <button id="connect-btn" class="bg-gray-400 hover:bg-gray-500 text-white text-sm font-semibold py-2.5 px-5 rounded-lg transition duration-150 shadow-sm">
                            Connect
                        </button>
                        
                        <!-- Connecting Badge (Hidden initially) -->
                        <div id="connecting-badge" class="hidden items-center gap-2 bg-amber-50 text-amber-700 px-4 py-2.5 rounded-lg text-sm border border-amber-200 font-medium">
                            <span class="relative flex h-3 w-3">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                            </span>
                            Connecting...
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mb-2 mt-1">
                        <span class="text-sm font-medium text-gray-500">Status:</span>
                        <span id="connection-status" class="text-sm font-semibold text-gray-400">Awaiting Hardware</span>
                    </div>

                    <!-- LED Button (Hidden until connected) -->
                    <button id="led-btn" class="hidden w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 px-4 rounded-lg transition duration-200 shadow-md flex justify-center items-center gap-2 mt-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Turn LED On
                    </button>
                </div>
            </div>

            <!-- Reset Button -->
            <div class="mt-8 pt-4 flex justify-center border-t border-gray-100 min-h-[60px]">
                <button id="reset-btn" class="hidden flex items-center gap-1.5 text-sm text-red-500 hover:text-red-700 font-semibold transition-colors bg-red-50 hover:bg-red-100 px-5 py-2.5 rounded-full border border-red-100">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reset System
                </button>
            </div>
        </div>
    </div>

    <!-- 20% Bottom Inactive Area -->
    <div class="bottom-section">
        <h2 class="text-xl sm:text-2xl font-bold text-gray-400 uppercase tracking-widest text-center px-4">
            Venus Jewel Diamond Finding Form
        </h2>
    </div>

    <script>
        // Data Initialization
        const now = new Date();
        const memos = [
            { id: 'M-8899', timestamp: new Date(now.getTime() - 1000 * 60 * 15) },
            { id: 'M-8898', timestamp: new Date(now.getTime() - 1000 * 60 * 45) },
            { id: 'M-8897', timestamp: new Date(now.getTime() - 1000 * 60 * 60 * 3) }
        ];

        // DOM Elements
        const memoSelect = document.getElementById('recent-memos');
        const memoInput = document.getElementById('memo-input');
        const fetchBtn = document.getElementById('fetch-btn');
        const successSection = document.getElementById('success-section');
        const rfidReader = document.getElementById('rfid-reader');
        const connectBtn = document.getElementById('connect-btn');
        const connectingBadge = document.getElementById('connecting-badge');
        const connectionStatus = document.getElementById('connection-status');
        const ledBtn = document.getElementById('led-btn');
        const resetBtn = document.getElementById('reset-btn');
        
        // Alert Elements
        const globalAlert = document.getElementById('global-alert');
        const globalAlertIcon = document.getElementById('global-alert-icon');
        const globalAlertText = document.getElementById('global-alert-text');
        
        let connectionTimeout = null; 
        let fetchTimeout = null;

        // Populate Recent Memos
        memos.forEach(memo => {
            const option = document.createElement('option');
            option.value = memo.id;
            const timeString = memo.timestamp.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const dateString = memo.timestamp.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            option.textContent = `${memo.id} - ${dateString}, ${timeString}`;
            memoSelect.appendChild(option);
        });

        // --- Alert Handlers ---
        const showGlobalAlert = (type, message) => {
            globalAlert.classList.remove('hidden');
            if (type === 'success') {
                globalAlert.className = 'px-4 py-3 rounded-lg relative mb-4 flex items-center justify-center gap-2 border mt-4 bg-green-50 border-green-200 text-green-700 transition-all';
                globalAlertIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            } else if (type === 'error') {
                globalAlert.className = 'px-4 py-3 rounded-lg relative mb-4 flex items-center justify-center gap-2 border mt-4 bg-red-50 border-red-200 text-red-700 transition-all';
                globalAlertIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            }
            globalAlertText.textContent = message;
        };

        const hideGlobalAlert = () => {
            globalAlert.classList.add('hidden');
        };

        // --- Global Activity Tracker for Reset Button ---
        const showResetButton = () => {
            resetBtn.classList.remove('hidden');
        };

        // Attach to all inputs to show reset button immediately
        memoSelect.addEventListener('change', (e) => {
            memoInput.value = e.target.value;
            showResetButton();
            hideGlobalAlert();
        });
        memoInput.addEventListener('input', () => {
            showResetButton();
            hideGlobalAlert();
        });
        rfidReader.addEventListener('change', showResetButton);

        // --- Fetch Logic with Timeout/Error Simulation ---
        fetchBtn.addEventListener('click', () => {
            showResetButton(); 
            hideGlobalAlert();
            
            if (!memoInput.value.trim()) {
                showGlobalAlert('error', 'Please enter or select a memo number.');
                return;
            }
            
            // Set Loading UI
            fetchBtn.innerHTML = '<svg class="animate-spin w-4 h-4 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32" stroke-linecap="round"></circle></svg> Fetching...';
            fetchBtn.disabled = true;
            fetchBtn.classList.add('opacity-75', 'cursor-not-allowed');
            
            if (fetchTimeout) clearTimeout(fetchTimeout);

            fetchTimeout = setTimeout(() => {
                // SIMULATION: 20% chance the fetch fails to demonstrate error handling
                const isError = Math.random() < 0.2; 

                // Reset button background state
                fetchBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Fetch Data Block';
                fetchBtn.disabled = false;
                fetchBtn.classList.remove('opacity-75', 'cursor-not-allowed');

                if (isError) {
                    showGlobalAlert('error', 'Network Timeout: Failed to fetch memo data.');
                    successSection.classList.add('hidden');
                } else {
                    fetchBtn.classList.add('hidden'); 
                    showGlobalAlert('success', 'Fetch Successful');
                    successSection.classList.remove('hidden');
                }
            }, 1500);
        });

        // --- Connection Logic with Error Simulation ---
        connectBtn.addEventListener('click', () => {
            showResetButton();
            
            if (!rfidReader.value) {
                showGlobalAlert('error', 'Please select an RFID reader from the dropdown.');
                return;
            }

            // Step 1: Connecting State UI
            connectBtn.classList.add('hidden'); 
            connectingBadge.classList.remove('hidden'); 
            connectingBadge.classList.add('flex');
            rfidReader.disabled = true; 
            
            connectionStatus.textContent = 'Establishing connection...';
            connectionStatus.className = 'text-sm font-semibold text-amber-600 animate-pulse';
            ledBtn.classList.add('hidden'); // Ensure LED is hidden during retry

            if (connectionTimeout) clearTimeout(connectionTimeout);

            // Step 2: Resolve Connection
            connectionTimeout = setTimeout(() => {
                connectingBadge.classList.add('hidden');
                connectingBadge.classList.remove('flex');
                
                // SIMULATION: 20% chance hardware connection fails
                const isError = Math.random() < 0.2; 
                
                if (isError) {
                    connectionStatus.textContent = 'Connection Timeout - Hardware not responding';
                    connectionStatus.className = 'text-sm font-semibold text-red-600';
                    
                    // Allow retry
                    connectBtn.classList.remove('hidden'); 
                    rfidReader.disabled = false;
                } else {
                    connectionStatus.textContent = 'Connected Successfully';
                    connectionStatus.className = 'text-sm font-semibold text-green-600';
                    ledBtn.classList.remove('hidden'); 
                }
            }, 2500);
        });

        // --- LED Logic ---
        ledBtn.addEventListener('click', () => {
            showResetButton();
            ledBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> LED is ON';
            ledBtn.classList.replace('bg-amber-500', 'bg-green-500');
            ledBtn.classList.replace('hover:bg-amber-600', 'hover:bg-green-600');
            
            setTimeout(() => {
                ledBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Turn LED On';
                ledBtn.classList.replace('bg-green-500', 'bg-amber-500');
                ledBtn.classList.replace('hover:bg-green-600', 'hover:bg-amber-600');
            }, 3000);
        });

        // --- Reset Logic ---
        resetBtn.addEventListener('click', () => {
            if (fetchTimeout) clearTimeout(fetchTimeout);
            if (connectionTimeout) clearTimeout(connectionTimeout);

            // Reset Inputs
            memoSelect.value = '';
            memoInput.value = '';
            rfidReader.value = '';
            rfidReader.disabled = false;
            
            // Reset Visibilities
            hideGlobalAlert();
            fetchBtn.classList.remove('hidden');
            fetchBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Fetch Data Block';
            fetchBtn.disabled = false;
            fetchBtn.classList.remove('opacity-75', 'cursor-not-allowed');

            successSection.classList.add('hidden');
            connectBtn.classList.remove('hidden');
            connectingBadge.classList.add('hidden');
            connectingBadge.classList.remove('flex');
            ledBtn.classList.add('hidden');
            resetBtn.classList.add('hidden'); 
            
            // Reset Status Text
            connectionStatus.textContent = 'Awaiting Hardware';
            connectionStatus.className = 'text-sm font-semibold text-gray-400';
            
            // Reset LED button visuals
            ledBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Turn LED On';
            ledBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
            ledBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');
        });
    </script>
</body>
</html>
