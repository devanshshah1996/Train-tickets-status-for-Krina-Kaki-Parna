<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Control System (Optimized)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        .main-section { height: 100vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; background-color: #f8fafc; padding: 1.5rem 1rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="main-section">
        <div class="bg-white p-5 sm:p-6 rounded-xl shadow-lg w-full max-w-lg border border-gray-100 my-auto flex-shrink-0">
            
            <!-- HEADER -->
            <div class="mb-3 text-center">
                <h1 class="text-xl font-bold text-gray-800 leading-tight">Memo Retrieval System</h1>
                <p class="text-xs text-gray-500 mt-0.5">Select a recent memo or enter manually.</p>
            </div>

            <!-- MEMO SELECTION UI -->
            <div id="ui-selection">
                <div class="mb-5">
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-sm font-bold text-gray-800">Recent Memos</label>
                        <span id="sync-indicator" class="text-xs text-gray-400 flex items-center gap-1 opacity-0 transition-opacity">
                            <svg class="animate-spin w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32"></circle></svg> Syncing
                        </span>
                    </div>
                    <div id="memo-list" class="flex flex-col gap-2 max-h-48 overflow-y-auto custom-scrollbar pr-1"></div>
                </div>

                <div class="relative flex py-1 items-center mb-3">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="mx-4 text-gray-400 text-[10px] uppercase font-bold tracking-wider">Manual Entry</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <div class="flex gap-2 mb-1">
                    <input type="text" id="memo-input" placeholder="7-digit memo (e.g., 3124567)" class="w-full border-gray-300 bg-gray-50 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border outline-none text-sm text-gray-700 disabled:bg-gray-100">
                    <button id="btn-fetch" class="sm:w-28 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 rounded-lg shadow-sm text-sm transition-colors">Fetch</button>
                </div>
            </div>

            <!-- ACTIVE MEMO UI -->
            <div id="ui-active-memo" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-4 mb-2 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 right-0 w-16 h-16 bg-blue-100 rounded-bl-full -mr-8 -mt-8"></div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-bold text-blue-500 uppercase">Active Memo</span>
                        <span id="active-time" class="text-[10px] text-blue-600 font-bold bg-blue-100 border border-blue-200 px-2 py-0.5 rounded"></span>
                    </div>
                    <h2 id="active-id" class="text-xl font-black text-blue-900 font-mono"></h2>
                    <p id="active-customer" class="text-xs font-semibold text-blue-700 mt-0.5"></p>
                    
                    <div class="mt-3 border-t border-blue-200 pt-3">
                        <div id="tabs-container" class="flex gap-1.5 mb-2.5 overflow-x-auto pb-1"></div>
                        <div id="pieces-container" class="flex flex-col gap-1.5 max-h-56 overflow-y-auto custom-scrollbar pr-1.5 pb-1"></div>
                    </div>
                </div>
            </div>

            <!-- GLOBAL ALERT -->
            <div id="global-alert" class="hidden px-3 py-2 rounded-lg relative mb-3 items-center justify-center gap-2 border mt-3 text-xs font-semibold"></div>

            <!-- HARDWARE UI -->
            <div id="ui-hardware" class="hidden border-t border-gray-100 pt-4 mt-3">
                <div class="flex flex-col gap-3">
                    <div id="hardware-selector">
                        <label class="block text-xs font-bold text-gray-800 mb-2">Select Hardware Interface</label>
                        <div class="flex gap-2" id="hw-buttons">
                            <button data-hw="reader1" class="hw-btn flex-1 bg-gray-50 border border-gray-300 text-gray-700 font-semibold py-2 rounded-lg text-xs hover:bg-gray-100 transition-all shadow-sm">Reader 1</button>
                            <button data-hw="reader2" class="hw-btn flex-1 bg-gray-50 border border-gray-300 text-gray-700 font-semibold py-2 rounded-lg text-xs hover:bg-gray-100 transition-all shadow-sm">Reader 2</button>
                            <button data-hw="reader3" class="hw-btn flex-1 bg-gray-50 border border-gray-300 text-gray-700 font-semibold py-2 rounded-lg text-xs hover:bg-gray-100 transition-all shadow-sm">Reader 3</button>
                        </div>
                        <div class="text-xs mt-2"><span class="text-gray-500 font-medium">Status: </span><span id="hw-status" class="font-semibold text-gray-400">Awaiting Selection</span></div>
                    </div>
                    
                    <div id="hardware-active" class="hidden items-center justify-between bg-green-50 border border-green-200 p-2.5 rounded-lg">
                        <div class="flex items-center gap-2">
                            <span class="relative flex h-2.5 w-2.5"><span class="animate-ping absolute h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative rounded-full h-2.5 w-2.5 bg-green-500"></span></span>
                            <span id="hw-active-name" class="font-bold text-green-800 text-xs"></span>
                        </div>
                        <span class="text-[10px] font-bold text-green-700 uppercase bg-green-100 px-1.5 py-0.5 rounded">Connected</span>
                    </div>

                    <button id="btn-led" class="hidden w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-4 rounded-lg shadow-md flex justify-center items-center gap-2 text-sm transition-colors">
                        Turn LED On
                    </button>
                </div>
            </div>

            <!-- RESET -->
            <div class="mt-4 pt-3 flex justify-center border-t border-gray-100 min-h-[40px]">
                <button id="btn-reset" class="hidden items-center gap-1.5 text-xs text-red-500 hover:text-red-700 font-bold transition-colors bg-red-50 hover:bg-red-100 px-4 py-1.5 rounded-full border border-red-100">
                    Reset System
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- CENTRALIZED APP STATE ---
        const State = {
            memos: [],
            activeMemo: null, // { id, customer, time, pieces: [] }
            currentTab: 'all', // all | pending | found | not-found
            isProcessing: false,
            ledOn: false,
            lastActivity: Date.now()
        };

        // --- ICONS & CONSTANTS ---
        const ICONS = {
            check: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`,
            cross: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`,
            spinner: `<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-dasharray="32"></circle></svg>`,
            bulbOn: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`,
            bulbOff: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`
        };

        // --- MOCK DATA GENERATOR ---
        const genPieces = (count) => Array.from({length: count}, () => ({
            id: 'VD' + Math.floor(100000 + Math.random() * 900000),
            shape: ['Round', 'Princess', 'Oval', 'Cushion', 'Emerald'][Math.floor(Math.random()*5)],
            carat: (Math.random() * 2 + 0.5).toFixed(2),
            color: ['D','E','F','G','H'][Math.floor(Math.random()*5)],
            clarity: ['IF','VVS1','VVS2','VS1','VS2','SI1'][Math.floor(Math.random()*6)],
            status: 'pending'
        }));

        State.memos = [
            { id: '3128492', customer: 'Venus Impex', timestamp: new Date(Date.now() - 120000), pieces: genPieces(6) }, 
            { id: '3128491', customer: 'Finestar Jewellery', timestamp: new Date(Date.now() - 900000), pieces: genPieces(4) },
            { id: '3000003', customer: 'Error Test Co.', timestamp: new Date(), pieces: [] } 
        ];

        // --- DOM ELEMENTS ---
        const els = {
            uiSel: document.getElementById('ui-selection'),
            uiAct: document.getElementById('ui-active-memo'),
            uiHw: document.getElementById('ui-hardware'),
            memoList: document.getElementById('memo-list'),
            memoInp: document.getElementById('memo-input'),
            btnFetch: document.getElementById('btn-fetch'),
            btnReset: document.getElementById('btn-reset'),
            alert: document.getElementById('global-alert'),
            tabsContainer: document.getElementById('tabs-container'),
            piecesContainer: document.getElementById('pieces-container'),
            hwBtns: document.getElementById('hw-buttons'),
            hwSelector: document.getElementById('hardware-selector'),
            hwActive: document.getElementById('hardware-active'),
            btnLed: document.getElementById('btn-led')
        };

        // --- CORE FUNCTIONS ---
        const showAlert = (type, msg) => {
            els.alert.className = `px-3 py-2 rounded-lg mb-3 flex items-center justify-center border mt-3 text-xs font-semibold z-20 ${type === 'success' ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'}`;
            els.alert.textContent = msg;
        };

        // Renders Selection List (String builder pattern avoids reflow loops)
        const renderMemoList = () => {
            els.memoList.innerHTML = State.memos.map(m => `
                <button onclick="handleFetch('${m.id}')" class="w-full text-left bg-white border border-gray-200 hover:border-blue-400 hover:bg-blue-50 text-gray-700 py-2 px-2.5 rounded-lg shadow-sm transition-all flex items-center justify-between disabled:opacity-50">
                    <div class="flex items-center gap-2.5"><span class="font-mono font-bold text-blue-700 text-sm">${m.id}</span><span class="text-xs font-medium">${m.customer}</span></div>
                    <div class="flex gap-1.5"><span class="text-[10px] text-gray-400">${m.timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>
                </button>
            `).join('');
        };

        // DB Persistence
        const syncDB = (save = true) => {
            const key = 'vj_memo_' + State.activeMemo.id;
            if (save) {
                localStorage.setItem(key, JSON.stringify(State.activeMemo.pieces.map(p => ({id: p.id, status: p.status}))));
            } else {
                const saved = JSON.parse(localStorage.getItem(key) || '[]');
                State.activeMemo.pieces.forEach(p => {
                    const found = saved.find(s => s.id === p.id);
                    if (found) p.status = found.status;
                });
            }
        };

        // Render Tabs dynamically
        const renderTabs = () => {
            const counts = { all: State.activeMemo.pieces.length, pending: 0, found: 0, 'not-found': 0 };
            State.activeMemo.pieces.forEach(p => counts[p.status]++);
            
            if (counts[State.currentTab] === 0) State.currentTab = Object.keys(counts).find(k => counts[k] > 0) || 'all';

            els.tabsContainer.innerHTML = Object.keys(counts).filter(k => counts[k] > 0).map(k => {
                const active = State.currentTab === k;
                return `<button onclick="State.currentTab='${k}'; renderPieces();" class="px-3 py-1.5 rounded-lg text-xs font-bold flex gap-1.5 border shadow-sm ${active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 hover:bg-blue-50'}">
                    <span class="capitalize">${k.replace('-',' ')}</span>
                    <span class="text-[10px] px-1.5 rounded-full ${active ? 'bg-blue-700 text-white' : 'bg-gray-100'}">${counts[k]}</span>
                </button>`;
            }).join('');
        };

        // Render Pieces List (Highly optimized string map)
        const renderPieces = () => {
            renderTabs();
            const filtered = State.activeMemo.pieces.filter(p => State.currentTab === 'all' || p.status === State.currentTab);
            
            if (!filtered.length) return els.piecesContainer.innerHTML = `<div class="text-center py-6 text-xs text-gray-400 italic">No items found.</div>`;

            els.piecesContainer.innerHTML = filtered.map(p => {
                const f = p.status === 'found', nf = p.status === 'not-found';
                return `
                <div class="flex items-center p-2.5 border rounded-lg shadow-sm ${f ? 'bg-green-50 border-green-200' : nf ? 'bg-red-50 border-red-200' : 'bg-white border-blue-100'}">
                    <button data-id="${p.id}" data-action="found" class="mr-2.5 w-5 h-5 rounded flex items-center justify-center border-[1.5px] ${f ? 'bg-green-500 border-green-500 text-white' : 'text-gray-300 hover:border-green-400 hover:text-green-400'}">${ICONS.check}</button>
                    <div class="flex-1">
                        <div class="flex items-center"><span class="font-mono font-bold text-xs ${f?'text-green-800 line-through opacity-70':nf?'text-red-800 line-through opacity-70':'text-gray-800'}">${p.id}</span></div>
                        <span class="text-[10px] font-medium ${p.status==='pending' ? 'text-gray-500' : 'text-gray-400'}">${p.shape} • <span class="font-bold">${p.carat}ct</span> • ${p.color} • ${p.clarity}</span>
                    </div>
                    <button data-id="${p.id}" data-action="not-found" class="ml-2.5 w-5 h-5 rounded flex items-center justify-center border-[1.5px] ${nf ? 'bg-red-500 border-red-500 text-white' : 'text-gray-300 hover:border-red-400 hover:text-red-400'}">${ICONS.cross}</button>
                </div>`;
            }).join('');
        };

        // EVENT DELEGATION for pieces (O(1) memory)
        els.piecesContainer.addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const piece = State.activeMemo.pieces.find(p => p.id === btn.dataset.id);
            piece.status = piece.status === btn.dataset.action ? 'pending' : btn.dataset.action;
            syncDB(true);
            renderPieces();
        });

        // Fetch Logic
        const handleFetch = (id = els.memoInp.value) => {
            if (State.isProcessing) return;
            if (!/^3\d{6}$/.test(id)) return showAlert('error', 'Memo must be 7 digits starting with 3.');
            
            State.isProcessing = true;
            els.btnFetch.innerHTML = ICONS.spinner;
            els.alert.classList.add('hidden');
            els.btnReset.classList.add('flex');
            els.btnReset.classList.remove('hidden');

            setTimeout(() => {
                State.isProcessing = false;
                els.btnFetch.innerHTML = 'Fetch';
                
                if (id === '3000003') return showAlert('error', 'Network Timeout: Failed to fetch memo.');
                
                const memoData = State.memos.find(m => m.id === id) || { id, customer: 'Manual Client', timestamp: new Date(), pieces: genPieces(5) };
                
                // Sort once on load
                memoData.pieces.sort((a,b) => a.shape.localeCompare(b.shape) || b.carat - a.carat);
                
                State.activeMemo = JSON.parse(JSON.stringify(memoData));
                syncDB(false); // Load from DB
                
                document.getElementById('active-id').textContent = id;
                document.getElementById('active-customer').textContent = State.activeMemo.customer;
                document.getElementById('active-time').textContent = State.activeMemo.timestamp.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
                
                els.uiSel.classList.add('hidden');
                els.uiAct.classList.remove('hidden');
                els.uiHw.classList.remove('hidden');
                renderPieces();
            }, 800);
        };

        els.btnFetch.onclick = () => handleFetch();
        els.memoInp.onkeypress = (e) => e.key === 'Enter' && handleFetch();

        // Hardware Logic
        els.hwBtns.addEventListener('click', e => {
            if (State.isProcessing) return;
            const btn = e.target.closest('button');
            if (!btn) return;
            
            State.isProcessing = true;
            document.querySelectorAll('.hw-btn').forEach(b => b.classList.add('opacity-50', 'pointer-events-none'));
            btn.innerHTML = `${ICONS.spinner} Connecting`;
            document.getElementById('hw-status').className = 'font-semibold text-amber-600 animate-pulse';
            document.getElementById('hw-status').textContent = 'Establishing connection...';

            setTimeout(() => {
                State.isProcessing = false;
                document.querySelectorAll('.hw-btn').forEach(b => b.classList.remove('opacity-50', 'pointer-events-none'));
                
                if (btn.dataset.hw === 'reader2') {
                    btn.innerHTML = 'Reader 2';
                    document.getElementById('hw-status').className = 'font-semibold text-red-600';
                    document.getElementById('hw-status').textContent = 'Timeout - Reader not responding';
                } else {
                    els.hwSelector.classList.add('hidden');
                    els.hwActive.classList.replace('hidden', 'flex');
                    document.getElementById('hw-active-name').textContent = btn.textContent.replace('Connecting', '').trim();
                    els.btnLed.classList.remove('hidden');
                }
            }, 1500);
        });

        els.btnLed.onclick = () => {
            State.ledOn = !State.ledOn;
            els.btnLed.innerHTML = `${State.ledOn ? ICONS.bulbOn : ICONS.bulbOff} Turn LED ${State.ledOn ? 'Off' : 'On'}`;
            els.btnLed.className = `w-full text-white font-bold py-2.5 px-4 rounded-lg shadow-md flex justify-center items-center gap-2 text-sm transition-colors ${State.ledOn ? 'bg-green-500 hover:bg-green-600' : 'bg-amber-500 hover:bg-amber-600'}`;
        };

        els.btnReset.onclick = () => {
            State.activeMemo = null;
            State.currentTab = 'all';
            els.memoInp.value = '';
            els.alert.classList.add('hidden');
            els.btnReset.classList.add('hidden');
            els.btnReset.classList.remove('flex');
            
            els.uiSel.classList.remove('hidden');
            els.uiAct.classList.add('hidden');
            els.uiHw.classList.add('hidden');
            
            // Reset Hardware UI
            els.hwSelector.classList.remove('hidden');
            els.hwActive.classList.replace('flex', 'hidden');
            els.btnLed.classList.add('hidden');
            document.querySelectorAll('.hw-btn').forEach(b => b.innerHTML = b.innerHTML.replace(/<svg.*<\/svg>\s*Connecting/, b.dataset.hw.replace('reader', 'Reader ')));
            document.getElementById('hw-status').className = 'font-semibold text-gray-400';
            document.getElementById('hw-status').textContent = 'Awaiting Selection';
        };

        // Activity simulator
        ['mousemove','keydown','click'].forEach(evt => window.addEventListener(evt, () => State.lastActivity = Date.now()));
        setInterval(() => {
            if (!State.activeMemo && !State.isProcessing && Date.now() - State.lastActivity > 4000) {
                document.getElementById('sync-indicator').classList.remove('opacity-0');
                setTimeout(() => {
                    if (Math.random() > 0.7) {
                        State.memos.unshift({ id: '3'+Math.floor(100000+Math.random()*900000), customer: 'Auto-Sync', timestamp: new Date(), pieces: genPieces(5) });
                        if(State.memos.length > 5) State.memos.pop();
                        renderMemoList();
                    }
                    document.getElementById('sync-indicator').classList.add('opacity-0');
                }, 800);
            }
        }, 4000);

        renderMemoList();
    </script>
</body>
</html>
